  <script>
    $(document).ready(function () {
      var parsedData = [];
      var headers = [];

      // Delimiter select toggle
      $('#delimiterSelect').on('change', function () {
        if ($(this).val() === 'custom') {
          $('#customDelimiterGroup').show();
        } else {
          $('#customDelimiterGroup').hide();
        }
      });

      function getDelimiter() {
        var sel = $('#delimiterSelect').val();
        if (sel === 'custom') {
          return $('#customDelimiter').val() || ',';
        }
        if (sel === 'tab') return '\t';
        return sel;
      }

      // Auto-detect delimiter from raw data
      function autoDetectDelimiter(text) {
        var firstLine = text.split('\n')[0] || '';
        var candidates = [
          { value: 'tab', count: (firstLine.match(/\t/g) || []).length },
          { value: ',', count: (firstLine.match(/,/g) || []).length },
          { value: ';', count: (firstLine.match(/;/g) || []).length },
          { value: '|', count: (firstLine.match(/\|/g) || []).length }
        ];
        candidates.sort(function (a, b) { return b.count - a.count; });
        if (candidates[0].count > 0) {
          var best = candidates[0].value;
          $('#delimiterSelect').val(best);
          $('#customDelimiterGroup').hide();
        }
      }

      $('#csvRaw').on('paste', function () {
        var self = this;
        setTimeout(function () {
          autoDetectDelimiter($(self).val());
        }, 0);
      });

      // Select all / deselect all
      $(document).on('click', '#selectAllBtn', function () {
        $('.col-check').prop('checked', true);
      });
      $(document).on('click', '#deselectAllBtn', function () {
        $('.col-check').prop('checked', false);
      });

      // Parse CSV
      $('#parseBtn').on('click', function () {
        var raw = $('#csvRaw').val().trim();
        if (!raw) return;

        var delimiter = getDelimiter();
        var hasHeader = $('#hasHeader').is(':checked');

        var result = Papa.parse(raw, {
          delimiter: delimiter,
          header: false,
          skipEmptyLines: true
        });

        var rows = result.data;
        if (rows.length === 0) return;

        if (hasHeader) {
          headers = rows[0].map(function (h) { return h.trim(); });
          parsedData = rows.slice(1);
        } else {
          headers = rows[0].map(function (_, i) { return '欄位 ' + (i + 1); });
          parsedData = rows;
        }

        renderTable();
        renderColumnControls();
        $('#exportBtn').prop('disabled', false);
        $('#swapBtn').prop('disabled', false);
        $('#columnControls').show();
        $('#parseSummary').text('共 ' + parsedData.length + ' 筆資料，' + headers.length + ' 個欄位');
      });

      function renderTable() {
        var html = '<table class="table table-bordered table-hover table-sm" id="parsedTable">';
        // Header
        html += '<thead class="thead-dark"><tr>';
        headers.forEach(function (h, i) {
          var colData = parsedData.map(function (row) { return (row[i] || '').trim(); }).filter(Boolean);
          var uniqueCount = _.uniq(colData).length;
          html += '<th class="col-header" data-col="' + i + '">';
          html += '<span>' + _.escape(h) + '</span>';
          html += ' <span class="badge badge-light col-badge">' + colData.length + '項';
          if (uniqueCount !== colData.length) {
            html += ' / 不重複' + uniqueCount;
          }
          html += '</span>';
          html += ' <i class="bi bi-clipboard ml-1" title="複製此欄位所有值"></i>';
          html += '</th>';
        });
        html += '</tr></thead>';
        // Body
        html += '<tbody>';
        parsedData.forEach(function (row) {
          html += '<tr>';
          headers.forEach(function (h, i) {
            html += '<td>' + window._.escape((row[i] || '').trim()) + '</td>';
          });
          html += '</tr>';
        });
        html += '</tbody></table>';
        $('#tableContainer').html(html);
        // Sync top scrollbar width
        var tableWidth = $('#tableContainer')[0].scrollWidth;
        $('#topScrollbar > div').width(tableWidth);
        // Sync scroll positions
        var syncing = false;
        $('#topScrollbar').off('scroll').on('scroll', function () {
          if (!syncing) {
            syncing = true;
            $('#tableContainer').scrollLeft($(this).scrollLeft());
            syncing = false;
          }
        });
        $('#tableContainer').off('scroll').on('scroll', function () {
          if (!syncing) {
            syncing = true;
            $('#topScrollbar').scrollLeft($(this).scrollLeft());
            syncing = false;
          }
        });
      }

      function renderColumnControls() {
        var html = '';
        headers.forEach(function (h, i) {
          html += '<label class="mr-3 mb-1"><input type="checkbox" class="col-check" value="' + i + '" checked> ' + window._.escape(h) + '</label>';
        });
        $('#columnCheckboxes').html(html);
      }

      // Copy column to clipboard
      $(document).on('click', '.col-header', function () {
        var colIndex = $(this).data('col');
        var colValues = parsedData.map(function (row) { return (row[colIndex] || '').trim(); }).filter(Boolean);
        var text = colValues.join('\n');

        navigator.clipboard.writeText(text).then(function () {
          swal('已複製', headers[colIndex] + ' 的 ' + colValues.length + ' 筆資料已複製到剪貼簿', 'success');
        }).catch(function () {
          // Fallback
          var $temp = $('<textarea>');
          $('body').append($temp);
          $temp.val(text).select();
          document.execCommand('copy');
          $temp.remove();
          swal('已複製', headers[colIndex] + ' 的 ' + colValues.length + ' 筆資料已複製到剪貼簿', 'success');
        });
      });

      // Export selected columns
      $('#exportBtn').on('click', function () {
        var selectedCols = [];
        $('.col-check:checked').each(function () {
          selectedCols.push(parseInt($(this).val()));
        });

        if (selectedCols.length === 0) {
          swal('提示', '請至少勾選一個欄位', 'warning');
          return;
        }

        var delimiter = getDelimiter();
        var useQuote = $('#quoteWrap').is(':checked');
        var lines = [];

        function wrapVal(val) {
          if (useQuote) return '"' + val.replace(/"/g, '""') + '"';
          return val;
        }

        // Header line
        if ($('#hasHeader').is(':checked')) {
          lines.push(selectedCols.map(function (i) { return wrapVal(headers[i]); }).join(delimiter));
        }

        // Data lines
        parsedData.forEach(function (row) {
          lines.push(selectedCols.map(function (i) { return wrapVal((row[i] || '').trim()); }).join(delimiter));
        });

        var result = lines.join('\n');
        $('#exportResult').val(result);
        $('#exportArea').show();
        // Scroll to export area
        $('html, body').animate({ scrollTop: $('#exportArea').offset().top }, 300);
      });

      // Download CSV
      $(document).on('click', '#downloadCsvBtn', function () {
        var content = $('#exportResult').val();
        if (!content) return;
        var BOM = '\uFEFF';
        var blob = new Blob([BOM + content], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'export.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      // Copy export result to clipboard
      $(document).on('click', '#copyExportBtn', function () {
        var content = $('#exportResult').val();
        if (!content) return;
        navigator.clipboard.writeText(content).then(function () {
          swal('已複製', '匯出結果已複製到剪貼簿', 'success');
        }).catch(function () {
          var $temp = $('<textarea>');
          $('body').append($temp);
          $temp.val(content).select();
          document.execCommand('copy');
          $temp.remove();
          swal('已複製', '匯出結果已複製到剪貼簿', 'success');
        });
      });

      // Swap columns
      $('#swapBtn').on('click', function () {
        var selectedCols = [];
        $('.col-check:checked').each(function () {
          selectedCols.push(parseInt($(this).val()));
        });

        if (selectedCols.length !== 2) {
          swal('提示', '請勾選恰好兩個欄位以進行互換', 'warning');
          return;
        }

        var colA = selectedCols[0];
        var colB = selectedCols[1];

        // Swap headers
        var tempHeader = headers[colA];
        headers[colA] = headers[colB];
        headers[colB] = tempHeader;

        // Swap data
        parsedData.forEach(function (row) {
          var temp = row[colA];
          row[colA] = row[colB];
          row[colB] = temp;
        });

        renderTable();
        renderColumnControls();
        swal('完成', '欄位「' + headers[colB] + '」與「' + headers[colA] + '」已互換', 'success');
      });

      // --- Flatten / Reduce Dimension ---
      var flattenedData = [];

      $('#flattenBtn').on('click', function () {
        var raw = $('#csvRaw').val();
        if (!raw.trim()) return;

        var delimiter = getDelimiter();
        var lines = raw.split('\n');
        flattenedData = [];
        lines.forEach(function (line) {
          var cells = line.split(delimiter);
          cells.forEach(function (cell) {
            var val = cell.trim();
            if (val) flattenedData.push(val);
          });
        });

        renderFlatten(flattenedData);
        $('#flattenArea').show();
        $('html, body').animate({ scrollTop: $('#flattenArea').offset().top }, 300);
      });

      function renderFlatten(data) {
        $('#flattenResult').val(data.join('\n'));
        $('#flattenSummary').text('共 ' + data.length + ' 筆 / 不重複 ' + window._.uniq(data).length + ' 筆');
      }

      // Flatten filter buttons
      $(document).on('click', '.flatten-filter-btn', function () {
        var filter = $(this).data('filter');
        var filtered = [];
        var regex;

        switch (filter) {
          case 'all':
            filtered = flattenedData;
            break;
          case 'chinese':
            regex = /[\u4e00-\u9fff]/;
            filtered = flattenedData.filter(function (v) { return regex.test(v); });
            break;
          case 'english':
            regex = /^[a-zA-Z\s]+$/;
            filtered = flattenedData.filter(function (v) { return regex.test(v); });
            break;
          case 'number':
            regex = /^[\d.\-+]+$/;
            filtered = flattenedData.filter(function (v) { return regex.test(v); });
            break;
          case 'email':
            regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            filtered = flattenedData.filter(function (v) { return regex.test(v); });
            break;
          case 'phone':
            regex = /^[\d\-+()\s]{7,}$/;
            filtered = flattenedData.filter(function (v) { return regex.test(v); });
            break;
          case 'url':
            regex = /^(https?:\/\/|www\.)/i;
            filtered = flattenedData.filter(function (v) { return regex.test(v); });
            break;
          case 'custom':
            var pattern = $('#flattenCustomRegex').val();
            if (!pattern) { swal('提示', '請輸入正則表達式', 'warning'); return; }
            try {
              regex = new RegExp(pattern);
            } catch (e) {
              swal('錯誤', 'Regex 語法不正確: ' + e.message, 'error');
              return;
            }
            filtered = flattenedData.filter(function (v) { return regex.test(v); });
            break;
        }
        renderFlatten(filtered);
      });

      // Toggle custom regex input
      $('#flattenCustomRegexBtn').on('click', function () {
        $('#flattenCustomRegexGroup').toggle();
      });

      // Copy flatten result
      $(document).on('click', '#copyFlattenBtn', function () {
        var content = $('#flattenResult').val();
        if (!content) return;
        navigator.clipboard.writeText(content).then(function () {
          swal('已複製', '降維剖析結果已複製到剪貼簿', 'success');
        }).catch(function () {
          var $temp = $('<textarea>');
          $('body').append($temp);
          $temp.val(content).select();
          document.execCommand('copy');
          $temp.remove();
          swal('已複製', '降維剖析結果已複製到剪貼簿', 'success');
        });
      });
    });
  </script>
</body>

</html>
